name: Verify TritonAI Harness enrollment

on:
  push:
    branches: [verify/tritonai-harness-20261020]

permissions:
  contents: read

jobs:
  scanner-and-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          uname -m
          docker info --format '{{.Architecture}} {{.NCPU}} {{.MemTotal}}'
      - name: Validate enrollment
        run: python3 tools/validate.py
      - name: Run complete Anthropic build and tools layer
        run: python3 tools/check --no-shell tritonai-harness
      - name: Run verifier in finished image without network
        run: |
          docker image inspect oss-scanner-check/built:tritonai-harness --format '{{.Id}} {{.Os}}/{{.Architecture}}'
          docker run --rm --init --network none --cpus 2 --memory 8g --cap-add SYS_PTRACE -w /src oss-scanner-check/built:tritonai-harness bash -euo pipefail -c '
            node --input-type=module -e '\''import assert from "node:assert/strict"; import os from "node:os"; assert.equal(process.arch, "x64"); assert.deepEqual(Object.keys(os.networkInterfaces()), ["lo"]); console.log("Native x86-64; loopback-only networking verified");'\''
            claude --version
            sh .oss-scanner/verify.sh
          '
